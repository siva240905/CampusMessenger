<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusLink Extension</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 420px; height: 580px; background-color: #020617; color: #f8fafc; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background: rgba(15, 23, 42, 0.95); padding: 12px 16px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(12px); }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: #ffffff; }
    .logo-icon { background: #4f46e5; color: white; padding: 6px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 10px; padding: 3px 10px; border-radius: 999px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .badge-online { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-offline { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }
    .settings-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .settings-btn:hover { background: #334155; color: white; }

    /* Settings Bar */
    #settingsPanel { display: none; background: #0f172a; padding: 12px; border-bottom: 1px solid #1e293b; }
    #settingsPanel.open { display: block; }
    .label { font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 4px; display: block; }
    .input { width: 100%; padding: 8px 12px; background: #020617; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 11px; margin-bottom: 8px; outline: none; font-family: monospace; }
    .input:focus { border-color: #6366f1; }

    main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    main::-webkit-scrollbar { width: 6px; }
    main::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    /* Card Styling (Matches Student Desktop Portal) */
    .card { background: rgba(15, 23, 42, 0.9); border: 1px solid #1e293b; border-radius: 16px; padding: 14px; font-size: 12px; transition: all 0.2s; }
    .card:hover { border-color: #334155; }
    .card.emergency { background: rgba(136, 19, 55, 0.25); border: 1px solid rgba(244, 63, 94, 0.4); }
    
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .prio-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; }
    .prio-normal { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3); }
    .prio-emergency { background: rgba(244, 63, 94, 0.2); color: #fecdd3; border: 1px solid rgba(244, 63, 94, 0.4); }
    .time-stamp { font-size: 10px; color: #94a3b8; font-family: monospace; }

    .card-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; color: #ffffff; }
    .card-msg { color: #cbd5e1; line-height: 1.5; margin-bottom: 10px; white-space: pre-line; word-break: break-word; }

    /* Media Container */
    .media-box { margin-bottom: 10px; border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; background: #020617; max-height: 240px; display: flex; align-items: center; justify-content: center; }
    .media-box img { width: 100%; max-height: 240px; object-fit: contain; }
    .media-box video { width: 100%; max-height: 240px; background: #000; }

    /* URL Box */
    .url-box { background: #020617; border: 1px solid #1e293b; padding: 6px 10px; border-radius: 10px; display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .url-tag { font-size: 9px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
    .url-input { background: transparent; border: none; color: #38bdf8; font-family: monospace; font-size: 11px; flex: 1; outline: none; }

    /* Action Buttons Row */
    .action-row { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; border-top: 1px solid rgba(51, 65, 85, 0.6); }
    .btn { border: none; padding: 6px 12px; border-radius: 10px; font-weight: 600; font-size: 11px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s; }
    .btn:active { transform: scale(0.96); }
    
    .btn-indigo { background: #4f46e5; color: white; }
    .btn-indigo:hover { background: #4338ca; }
    .btn-sky { background: #0284c7; color: white; }
    .btn-sky:hover { background: #0369a1; }
    .btn-slate { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .btn-slate:hover { background: #334155; }
    .btn-purple { background: #9333ea; color: white; }
    .btn-purple:hover { background: #7e22ce; }
    .btn-teal { background: #0d9488; color: white; }
    .btn-teal:hover { background: #0f766e; }
    .btn-emerald { background: #059669; color: white; }
    .btn-emerald:hover { background: #047857; }

    .empty { text-align: center; padding: 60px 20px; color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">💻</div>
      CampusLink Extension
    </div>
    <div class="header-actions">
      <div id="statusBadge" class="badge badge-offline">Connecting...</div>
      <button id="toggleSettings" class="settings-btn">⚙️ Server</button>
    </div>
  </header>

  <div id="settingsPanel">
    <label class="label">Backend Server URL:</label>
    <input type="text" id="urlInput" class="input" placeholder="https://campusmessenger-backend.onrender.com or http://127.0.0.1:8000" />
    <button id="saveUrlBtn" class="btn btn-indigo" style="width: 100%; justify-content: center;">Save & Connect Server</button>
  </div>

  <main id="feed">
    <div class="empty">
      📡 Waiting for announcements...
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
